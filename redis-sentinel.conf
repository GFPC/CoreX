# Redis Sentinel configuration for the GFP CoreX scale stack.
# Sentinel monitors the primary Redis (docker service name "redis") and would
# coordinate automatic failover to a replica in a real multi-node deployment.

port 26379

# The primary is addressed by its Docker service hostname rather than an IP,
# so hostname resolution must be enabled (Redis 6.2+).
sentinel resolve-hostnames yes

# monitor <name> <host> <port> <quorum>. Quorum 1 suits the single-sentinel
# demo topology; production would run an odd number (3/5) with a matching quorum.
sentinel monitor mymaster redis 6379 1
sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 10000
sentinel parallel-syncs mymaster 1
