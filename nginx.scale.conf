# Nginx load balancer for the GFP CoreX scale stack (docker-compose.scale.yml).
# Mounted as the full /etc/nginx/nginx.conf, so it defines the events + http blocks.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Least-connections beats round-robin when request durations vary (e.g. one
    # request triggers plugin execution while others are cheap health checks).
    upstream corex_backend {
        least_conn;
        server app1:8000 max_fails=3 fail_timeout=15s;
        server app2:8000 max_fails=3 fail_timeout=15s;
        server app3:8000 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json text/plain application/javascript text/css;

    # Log to stdout/stderr so `docker compose logs nginx` shows live traffic,
    # including which upstream served each request and how long it took.
    log_format corex '$remote_addr - $status "$request" '
                     'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout corex;
    error_log  /dev/stderr warn;

    server {
        listen 80;
        server_name _;

        # Load-balancer's own liveness endpoint (not proxied).
        location = /nginx-health {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://corex_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;

            # Fail over to the next instance if one is down or returns a 5xx.
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}
