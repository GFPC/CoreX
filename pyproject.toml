[tool.poetry]
name = "gfp-corex"
version = "0.2.0"
description = "Production-ready multi-tenant FastAPI platform with dynamic plugin engine"
authors = ["fealx15 <fealx15@gmail.com>"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/fealx15/CoreX"
repository = "https://github.com/fealx15/CoreX"
keywords = ["fastapi", "multi-tenant", "plugin", "async", "backend"]
packages = [{include = "gfpcorex", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.116.1"
uvicorn = {extras = ["standard"], version = "^0.35.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.42"}
asyncpg = "^0.29.0"
redis = {extras = ["hiredis"], version = "^6.2.0"}
pydantic = {extras = ["dotenv"], version = "^2.11.7"}
pydantic-settings = "^2.2.1"
pyyaml = "^6.0.1"
python-multipart = "^0.0.9"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
httpx = "^0.27.0"
aiomysql = "^0.2.0"
requests = "^2.31.0"
structlog = "^24.1.0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
ruff = "^0.5.0"
mypy = "^1.8.0"
pre-commit = "^3.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=src/gfpcorex --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = []

