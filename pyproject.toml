[tool.poetry]
name = "gfp-corex"
version = "0.1.0"
description = "Production-ready multi-configuration FastAPI backend"
authors = ["GFP <fealx15@gmail.com>"]
readme = "README.md"
packages = [{include = "gfpcorex", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.116.1"
uvicorn = {extras = ["standard"], version = "^0.35.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.42"}
asyncpg = "^0.29.0"
redis = {extras = ["hiredis"], version = "^6.2.0"}
pydantic = {extras = ["dotenv"], version = "^2.11.7"}
pydantic-settings = "^2.2.1"
pyyaml = "^6.0.1"
python-multipart = "^0.0.9"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
httpx = "^0.27.0"
requests = "^2.31.0"
structlog = "^24.1.0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
black = "^24.1.0"
isort = "^5.13.0"
flake8 = "^7.0.0"
mypy = "^1.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
