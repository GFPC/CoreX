# Development Configuration
# TODO: Replace with your actual development values

# Database Configuration
db:
  url: "mysql+aiomysql://gfp_user:gfp_password@127.0.0.1:3307/gfp_dev_db"
  pool_size: 10
  max_overflow: 20
  pool_pre_ping: true
  echo: false

# Redis Configuration
redis:
  url: "redis://127.0.0.1:6379/0"
  pool_size: 10
  decode_responses: true

# Authentication
auth:
  # Loaded from $GFP_DEV_SECRET_KEY; falls back to an obviously-insecure dev default.
  # NEVER rely on the default outside local development.
  secret_key: "${GFP_DEV_SECRET_KEY:-dev-insecure-secret-change-me-please-0123456789}"
  algorithm: "HS256"
  access_token_expire_minutes: 30
  refresh_token_expire_days: 7

# Application Settings
app:
  title: "GFP CoreX Dev"
  version: "1.0.0"
  debug: true
  cors_origins: ["http://localhost:3000", "http://localhost:8080"]

# Logging
logging:
  level: "DEBUG"
  format: "text"
  handlers: ["console"]

# Security
security:
  bcrypt_rounds: 12
  rate_limit_per_minute: 100
  max_request_size: "10MB" 