# Test Configuration
# TODO: Replace with your actual test values

# Database Configuration
db:
  url: "postgresql+asyncpg://gfp_user:gfp_password@localhost:5432/test_db"
  pool_size: 3
  max_overflow: 5
  pool_pre_ping: true
  echo: false

# Redis Configuration
redis:
  url: "redis://localhost:6379/2"
  pool_size: 3
  decode_responses: true

# Authentication
auth:
  secret_key: "test_secret_key_for_testing_only_change_in_production_32"
  algorithm: "HS256"
  access_token_expire_minutes: 15
  refresh_token_expire_days: 1

# Application Settings
app:
  title: "GFP CoreX Test"
  version: "1.0.0"
  debug: true
  cors_origins:
    - "http://localhost:3000"
    - "http://test.localhost"

# Logging
logging:
  level: "DEBUG"
  format: "text"
  handlers:
    - console

# Security
security:
  bcrypt_rounds: 2  # Very fast for testing
  rate_limit_per_minute: 10000
  max_request_size: "10MB" 