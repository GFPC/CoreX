# Production Configuration
# TODO: Replace with your actual production values

# Database Configuration
db:
  url: "postgresql+asyncpg://user:pass@postgres:5432/prod_db"
  pool_size: 20
  max_overflow: 30
  pool_pre_ping: true
  echo: false

# Redis Configuration
redis:
  url: "redis://redis:6379/1"
  pool_size: 10
  decode_responses: true

# Authentication
auth:
  secret_key: "ENCRYPTED_KEY_HERE_CHANGE_IN_PRODUCTION_32_CHARS_MIN"
  algorithm: "HS256"
  access_token_expire_minutes: 30
  refresh_token_expire_days: 7

# Application Settings
app:
  title: "GFP CoreX Production"
  version: "1.0.0"
  debug: false
  cors_origins:
    - "https://yourdomain.com"
    - "https://api.yourdomain.com"

# Logging
logging:
  level: "INFO"
  format: "json"
  handlers:
    - console
    - file

# Security
security:
  bcrypt_rounds: 12
  rate_limit_per_minute: 100
  max_request_size: "10MB" 