version: '3.8'

services:
  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: gfp_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.scale.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app1
      - app2
      - app3
    networks:
      - gfp_network

  # Multiple API instances
  app1:
    build: .
    container_name: gfp_app_1
    environment:
      - PYTHONPATH=/app
      - CONFIG_NAME=prod
    volumes:
      - ./configs:/app/configs:ro
    depends_on:
      - mysql
      - redis
    networks:
      - gfp_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  app2:
    build: .
    container_name: gfp_app_2
    environment:
      - PYTHONPATH=/app
      - CONFIG_NAME=prod
    volumes:
      - ./configs:/app/configs:ro
    depends_on:
      - mysql
      - redis
    networks:
      - gfp_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  app3:
    build: .
    container_name: gfp_app_3
    environment:
      - PYTHONPATH=/app
      - CONFIG_NAME=prod
    volumes:
      - ./configs:/app/configs:ro
    depends_on:
      - mysql
      - redis
    networks:
      - gfp_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Shared Database (MySQL)
  mysql:
    image: mysql:8.0
    container_name: gfp_mysql_shared
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: gfp_prod_db
      MYSQL_USER: gfp_user
      MYSQL_PASSWORD: gfp_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init-mysql.sql:/docker-entrypoint-initdb.d/init-mysql.sql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - gfp_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Shared Redis
  redis:
    image: redis:7-alpine
    container_name: gfp_redis_shared
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - gfp_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Sentinel for high availability (optional)
  redis-sentinel1:
    image: redis:7-alpine
    container_name: gfp_redis_sentinel_1
    command: redis-sentinel /usr/local/etc/redis/sentinel.conf
    volumes:
      - ./redis-sentinel.conf:/usr/local/etc/redis/sentinel.conf:ro
    depends_on:
      - redis
    networks:
      - gfp_network

  # Monitoring (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: gfp_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - gfp_network

  grafana:
    image: grafana/grafana:latest
    container_name: gfp_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - gfp_network

volumes:
  mysql_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  gfp_network:
    driver: bridge 